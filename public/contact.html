<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Ozzie Tracker</title>
<style>
  body{
    background:#F6F1E4;
    color:#1F2A24;
    font-family:'Iowan Old Style','Georgia',serif;
    max-width:520px;
    margin:0 auto;
    padding:24px 20px 60px;
    line-height:1.6;
  }
  h1{font-size:1.4rem;margin-bottom:6px;}
  p.intro{font-size:0.9rem;color:#2A3F30;margin-bottom:20px;}
  .back{
    display:inline-block;
    margin-bottom:20px;
    font-family:'Courier New',monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#3F5D46;
    text-decoration:none;
  }
  label{
    display:block;
    font-family:'Courier New',monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#3F5D46;
    margin-bottom:5px;
    margin-top:14px;
  }
  input, textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid #D8CFB8;
    border-radius:8px;
    background:#FFFDF7;
    font-family:'Iowan Old Style','Georgia',serif;
    font-size:0.95rem;
    color:#1F2A24;
  }
  textarea{min-height:120px;resize:vertical;}
  button{
    margin-top:18px;
    width:100%;
    background:#3F5D46;
    color:#F6F1E4;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-family:'Courier New',monospace;
    font-size:0.72rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
  }
  button:disabled{opacity:0.6;cursor:default;}
  #formMsg{
    margin-top:14px;
    font-size:0.85rem;
    padding:10px 12px;
    border-radius:8px;
    display:none;
  }
  #formMsg.success{
    display:block;
    background:#E4EEE6;
    color:#2A3F30;
  }
  #formMsg.error{
    display:block;
    background:#F5E1DA;
    color:#B5563C;
  }
  footer{
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid #D8CFB8;
    font-family:'Courier New',monospace;
    font-size:0.68rem;
    color:#3F5D46;
  }
  footer a{color:#3F5D46;font-weight:700;}
  footer img.logo{
    height:16px;
    vertical-align:middle;
    margin-right:5px;
  }
</style>
</head>
<body>

<a class="back" href="index.html">&larr; Back to tracker</a>

<h1>Get in touch</h1>
<p class="intro">Questions, bugs, or ideas about Ozzie Tracker &mdash; send a message and TechTyra will get back to you.</p>

<form id="contactForm">
  <input type="hidden" name="access_key" value="c6f64ea8-cb9e-445e-8f53-57768e995db9">
  <input type="hidden" name="subject" value="New message from Ozzie Tracker">
  <input type="checkbox" name="botcheck" style="display:none;" tabindex="-1" autocomplete="off">

  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="message">Message</label>
  <textarea id="message" name="message" required></textarea>

  <button type="submit" id="submitBtn">Send message</button>
  <div id="formMsg"></div>
</form>

<footer>
  Built by <a href="https://techtyra.com.au" target="_blank" rel="noopener"><img class="logo" src="assets/techtyra-logo.png" alt="TechTyra">TechTyra</a> &middot; <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms &amp; Conditions</a>
</footer>

<script>
  const form = document.getElementById('contactForm');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('formMsg');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Sending...';
    msg.style.display = 'none';
    msg.className = '';

    try{
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      const data = await res.json();
      if(data.success){
        msg.textContent = "Thanks — your message has been sent. We'll get back to you soon.";
        msg.className = 'success';
        form.reset();
      } else {
        throw new Error(data.message || 'Something went wrong');
      }
    }catch(err){
      msg.textContent = "Couldn't send your message right now. Please try again shortly.";
      msg.className = 'error';
    }finally{
      btn.disabled = false;
      btn.textContent = 'Send message';
    }
  });
</script>

</body>
</html>
