<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Ooshie Tracker</title>
<style>
  :root{
    --bg-top:#3A4A9E;
    --bg-bottom:#8FA3E8;
    --panel:#2F3D82;
    --line:#5A69B5;
    --ink:#F5F3FF;
    --sub:#C3CBF2;
    --gold:#F0C244;
    --teal:#4FC3B0;
    --coral:#E8674F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    width:100%;
  }
  .wrap{
    max-width:520px;
    width:100%;
    margin:0 auto;
    padding:20px 16px 24px;
    flex:1 0 auto;
    box-sizing:border-box;
  }
  h1{font-size:1.3rem;margin:0 0 4px;color:var(--gold);}
  p.intro{font-size:0.86rem;color:var(--sub);margin-bottom:18px;line-height:1.5;}
  .back{
    display:inline-block;
    margin-bottom:18px;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--sub);
    text-decoration:none;
    font-weight:600;
  }
  label{
    display:block;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--sub);
    margin-bottom:5px;
    margin-top:14px;
    font-weight:600;
  }
  input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--panel);
    font-family:inherit;
    font-size:0.92rem;
    color:var(--ink);
    box-sizing:border-box;
  }
  input::placeholder{color:var(--sub);opacity:0.6;}
  button{
    margin-top:18px;
    width:100%;
    background:var(--gold);
    color:#2A2100;
    border:none;
    border-radius:9px;
    padding:12px 20px;
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:0.03em;
    cursor:pointer;
  }
  button:disabled{opacity:0.6;cursor:default;}
  #formMsg{
    margin-top:14px;
    font-size:0.85rem;
    padding:10px 12px;
    border-radius:9px;
    display:none;
  }
  #formMsg.success{
    display:block;
    background:rgba(79,195,176,0.18);
    color:var(--teal);
  }
  #formMsg.error{
    display:block;
    background:rgba(232,103,79,0.18);
    color:var(--coral);
  }
  footer{
    flex-shrink:0;
    width:100%;
    background:var(--panel);
    color:var(--sub);
    padding:8px 4px 6px;
    font-size:0.64rem;
    text-align:center;
    border-top:1px solid var(--line);
    line-height:1.5;
  }
  footer a{color:var(--gold);font-weight:600;text-decoration:none;}
</style>
</head>
<body>

<div class="wrap">
<a class="back" href="index.html">Back to tracker</a>

<h1>Get in touch</h1>
<p class="intro">Questions, bugs, or ideas about Ooshie Tracker. Send a message and TechTyra will get back to you.</p>

<form id="contactForm">
  <input type="hidden" name="access_key" value="c6f64ea8-cb9e-445e-8f53-57768e995db9">
  <input type="hidden" name="subject" value="New message from Ooshie Tracker">
  <input type="checkbox" name="botcheck" style="display:none;" tabindex="-1" autocomplete="off">

  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="message">Message</label>
  <input type="text" id="message" name="message" required placeholder="What would you like to tell us">

  <button type="submit" id="submitBtn">Send message</button>
  <div id="formMsg"></div>
</form>
</div>

<footer>
  Product of <a href="https://techtyra.com.au" target="_blank" rel="noopener">TechTyra</a>
  &middot; <a href="privacy.html">Privacy</a>
  &middot; <a href="terms.html">Terms</a>
  &middot; <a href="contact.html">Contact</a>
</footer>

<script>
  const form = document.getElementById('contactForm');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('formMsg');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Sending';
    msg.style.display = 'none';
    msg.className = '';

    try{
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      const data = await res.json();
      if(data.success){
        msg.textContent = "Thanks, your message has been sent. We will get back to you soon.";
        msg.className = 'success';
        form.reset();
      } else {
        throw new Error(data.message || 'Something went wrong');
      }
    }catch(err){
      msg.textContent = "Could not send your message right now. Please try again shortly.";
      msg.className = 'error';
    }finally{
      btn.disabled = false;
      btn.textContent = 'Send message';
    }
  });
</script>

</body>
</html>
