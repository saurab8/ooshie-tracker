<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ooshie Tracker</title>
<script src="assets/qrcode.min.js"></script>
<script src="assets/jsQR.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function(){
    if(typeof QRCode === 'undefined'){
      console.error('QR code library failed to load');
    }
  });
</script>
<style>
  :root{
    --bg-top:#3A4A9E;
    --bg-bottom:#8FA3E8;
    --panel:#2F3D82;
    --panel-light:#4655A0;
    --line:#5A69B5;
    --ink:#F5F3FF;
    --sub:#C3CBF2;
    --gold:#F0C244;
    --gold-dark:#B8912E;
    --teal:#4FC3B0;
    --coral:#E8674F;
    --leaf:#7CB342;
    --have:#4FC3B0;
    --missing:#7C86C4;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  button{touch-action:manipulation;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  #appMain{
    display:flex;
    flex-direction:column;
    flex:1 0 auto;
    width:100%;
  }
  .label-font{
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  header{
    padding:12px 16px 0;
    z-index:20;
    flex-shrink:0;
  }
  header h1{
    margin:0;
    font-size:1.25rem;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--gold);
  }
  header .tag{
    font-size:0.72rem;
    color:var(--sub);
    margin-top:2px;
  }

  .progress-wrap{
    padding:8px 16px 0;
    flex-shrink:0;
  }
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:0.72rem;
    margin-bottom:4px;
    color:var(--sub);
  }
  .progress-row .count{
    font-size:0.95rem;
    font-weight:700;
    color:var(--gold);
  }
  .progress-bar{
    height:6px;
    background:rgba(255,255,255,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--teal);
    transition:width 0.3s ease;
  }

  nav.top-tabs{
    display:flex;
    gap:5px;
    margin:8px 16px 0;
    flex-shrink:0;
  }
  nav.top-tabs button{
    flex:1;
    background:rgba(255,255,255,0.08);
    border:1px solid var(--line);
    border-radius:9px;
    font-size:0.72rem;
    font-weight:600;
    padding:8px 3px;
    color:var(--sub);
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  nav.top-tabs button.active{
    background:var(--gold);
    color:#2A2100;
    border-color:var(--gold);
  }

  nav.set-tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    padding:8px 16px 0;
    flex-shrink:0;
  }
  nav.set-tabs button{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
    font-size:0.66rem;
    font-weight:600;
    padding:8px 2px;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
    line-height:1.15;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  nav.set-tabs button.wide{
    font-size:0.6rem;
    padding:8px 1px;
  }
  nav.set-tabs button.active{
    background:var(--teal);
    color:#0d2e28;
    border-color:var(--teal);
  }
  nav.want-set-tabs{
    padding:0;
    margin:8px 0;
  }

  main{
    padding:8px 16px;
    max-width:640px;
    margin:0 auto;
    width:100%;
  }

  .set-block{
    margin-bottom:0;
  }
  .set-title{
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--sub);
    border-bottom:1px solid var(--line);
    padding-bottom:4px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }

  .ozzie-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 10px 6px 6px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .ozzie-card.missing{
    opacity:0.6;
  }
  .ozzie-photo{
    width:40px;
    height:40px;
    border-radius:9px;
    background:var(--panel-light);
    flex-shrink:0;
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.58rem;
    font-weight:700;
    color:var(--sub);
    text-align:center;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .ozzie-status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
    background:var(--missing);
  }
  .ozzie-card.have .ozzie-status-dot{
    background:var(--have);
  }
  .ozzie-name{
    flex:1;
    font-size:0.92rem;
    line-height:1.2;
    color:var(--ink);
  }
  .ozzie-name .badge{
    display:block;
    font-size:0.64rem;
    color:var(--gold);
    letter-spacing:0.02em;
    margin-top:1px;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stepper button{
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--gold);
    background:transparent;
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
  }
  .stepper button:active{
    background:var(--gold);
    color:#2A2100;
  }
  .stepper .qty{
    min-width:20px;
    text-align:center;
    font-weight:700;
    font-size:1.05rem;
    color:var(--ink);
  }

  .swap-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 10px 6px 6px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .swap-card .ozzie-photo{width:40px;height:40px;}

  .empty-msg{
    text-align:center;
    padding:36px 20px;
    color:var(--sub);
    font-size:0.95rem;
    opacity:0.85;
  }

  .want-summary{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    margin-bottom:0;
    font-size:0.92rem;
    color:var(--ink);
  }
  .want-summary .swap-total{
    font-weight:700;
    color:var(--coral);
  }

  .want-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 10px 6px 6px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .want-card .ozzie-name{font-size:0.92rem;}
  .want-card .ozzie-photo{width:40px;height:40px;}

  .match-section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:8px;
    text-align:center;
  }
  .match-section h3{
    margin:0 0 6px;
    font-size:1.05rem;
    color:var(--gold);
  }
  .match-section p{
    font-size:0.85rem;
    color:var(--sub);
    margin:0 0 12px;
  }
  .big-btn{
    background:var(--gold);
    color:#2A2100;
    border:none;
    border-radius:10px;
    padding:13px 20px;
    font-size:0.85rem;
    font-weight:700;
    letter-spacing:0.03em;
    cursor:pointer;
    width:100%;
  }
  .big-btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--gold);
  }
  #qrCanvasWrap{
    display:flex;
    justify-content:center;
    margin:14px 0;
  }
  #qrCanvasWrap canvas{
    border-radius:8px;
    padding:12px;
    background:#fff;
    box-sizing:content-box;
    max-width:calc(100% - 24px);
    height:auto;
  }
  #qrCanvasWrap img{
    width:260px;
    height:260px;
    max-width:calc(100% - 24px);
    padding:12px;
    background:#fff;
    box-sizing:content-box;
    border-radius:8px;
  }
  video#scanVideo{
    width:100%;
    border-radius:8px;
    border:1px solid var(--line);
    margin:10px 0;
  }
  .scan-status{
    min-height:1.4em;
    margin:8px 0 0;
    color:var(--sub);
    font-size:0.78rem;
  }
  .scan-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
  }
  .scan-actions .big-btn{padding:10px 8px;}
  #scanFile{display:none;}
  .match-result{
    background:var(--panel-light);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:8px;
  }
  .match-result h4{
    margin:0 0 8px;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--teal);
    font-weight:700;
  }
  .match-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
    font-size:0.92rem;
    color:var(--ink);
  }
  .match-row:last-child{border-bottom:none;}
  .match-row .arrow{
    color:var(--coral);
    margin:0 6px;
  }
  .no-match{
    text-align:center;
    color:var(--sub);
    opacity:0.85;
    font-size:0.9rem;
    padding:16px;
  }

  footer.stats{
    flex-shrink:0;
    width:100%;
    background:var(--panel);
    color:var(--sub);
    padding:8px 4px 6px;
    font-size:0.64rem;
    text-align:center;
    border-top:1px solid var(--line);
    line-height:1.5;
    box-sizing:border-box;
    margin-top:auto;
  }
  footer.stats a{
    color:var(--gold);
    text-decoration:none;
    font-weight:600;
  }

  .save-flash{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--teal);
    color:#0d2e28;
    font-size:0.75rem;
    font-weight:700;
    padding:7px 16px;
    border-radius:20px;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    z-index:30;
  }
  .save-flash.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <h1>Ooshie Tracker</h1>
  <div class="tag">40 characters &middot; track, swap, want, match</div>
</header>

<div class="progress-wrap">
  <div class="progress-row">
    <span class="label-font">Collected</span>
    <span class="count" id="progressCount">0 / 40</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<nav class="top-tabs">
  <button class="top-tab-btn active" data-top="collection">Collection</button>
  <button class="top-tab-btn" data-top="swap">Swap</button>
  <button class="top-tab-btn" data-top="want">Want</button>
  <button class="top-tab-btn" data-top="match">Match</button>
</nav>

<nav class="set-tabs" id="setTabs"></nav>

<div id="appMain">
  <main>
    <div id="view-collection"></div>
    <div id="view-swap" style="display:none;"></div>
    <div id="view-want" style="display:none;"></div>
    <div id="view-match" style="display:none;"></div>
  </main>
</div>

<div class="save-flash" id="saveFlash">saved</div>

<footer class="stats">
  <span id="uniqueUsers">— collectors have used Ooshie Tracker —</span><br>
  Product of <a href="https://techtyra.com.au" target="_blank" rel="noopener">TechTyra</a>
  &middot; <a href="privacy.html">Privacy</a>
  &middot; <a href="terms.html">Terms</a>
  &middot; <a href="contact.html">Contact</a>
</footer>

<script>
(function(){

  const OZZIES = [
    {set:"Moana", label:"Moana", items:["Moana","Maui","Pua","Hei Hei","Kakamora"]},
    {set:"Toy Story 5", label:"Toy Story", items:["Jessie","Woody","Buzz Lightyear","Bullseye","Lilypad"]},
    {set:"Spider-Man", label:"Spider-Man", items:["Spider-Man","Hulk","Tombstone","Scorpion","Tarantula"]},
    {set:"Mandalorian", label:"Mandalorian", items:["Mandalorian","Grogu","Anzellan","Zeb","Stormtrooper"]},
    {set:"Disney", label:"Disney", items:["Elsa","Anna","Stitch","Lilo","Judy Hopps"]},
    {set:"Pixar", label:"Pixar", items:["Mike","Sully","Anxiety","Joy","Lightning McQueen"]},
    {set:"Marvel", label:"Marvel", items:["The Thing","Wolverine","Doctor Doom","Thor","Gambit"]},
    {set:"Star Wars", label:"Star Wars", items:["Darth Vader","C-3PO","Princess Leia","Luke Skywalker","R2-D2"]}
  ];

  function slugify(str){
    return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  const ALL_IDS = [];
  OZZIES.forEach(s => s.items.forEach(name => ALL_IDS.push(setKey(s.set, name))));
  const QR_ITEMS = [];
  OZZIES.forEach(s => s.items.forEach(name => QR_ITEMS.push({n:name, s:s.set})));

  function setKey(set, name){ return set + "::" + name; }
  function imgPath(set, name){
    return `images/${slugify(set)}/${slugify(name)}.jpg`;
  }

  const STORAGE_KEY = "ozzie-tracker-data-v2";
  const USER_FLAG_KEY = "ozzie-tracker-counted-v1";

  let state = loadState();
  let activeSetIndex = 0;
  let activeWantSetIndex = 0;
  let activeTop = 'collection';

  function loadState(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    let parsed = raw ? JSON.parse(raw) : {};
    let counts = parsed.counts || {};
    let swap = parsed.swap || {};
    let want = parsed.want || {};
    ALL_IDS.forEach(id => {
      if(typeof counts[id] !== "number") counts[id] = 0;
      if(typeof swap[id] !== "number") swap[id] = 0;
    });
    return {counts, swap, want};
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      flashSave();
    }catch(e){}
  }

  let flashTimer = null;
  function flashSave(){
    const el = document.getElementById('saveFlash');
    el.classList.add('show');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(()=> el.classList.remove('show'), 700);
  }

  function photoTile(set, name){
    const src = imgPath(set, name);
    const div = document.createElement('div');
    div.className = 'ozzie-photo';
    div.style.backgroundImage = `url('${src}')`;
    div.textContent = '';
    const fallback = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const img = new Image();
    img.onerror = () => { div.style.backgroundImage = 'none'; div.textContent = fallback; };
    img.src = src;
    return div;
  }

  let visitorCountRequest = null;

  async function trackUniqueUser(increment = false){
    try{
      const already = localStorage.getItem(USER_FLAG_KEY);
      const shouldIncrement = increment && !already;
      if(visitorCountRequest && shouldIncrement) return visitorCountRequest;

      const request = (async () => {
        const resp = await fetch('/api/visitor', {
          method: shouldIncrement ? 'POST' : 'GET',
          headers: shouldIncrement ? { 'X-Ooshie-Action': 'tracker-use' } : {}
        });
        if(!resp.ok) throw new Error('bad response');
        const data = await resp.json();
        if(shouldIncrement) localStorage.setItem(USER_FLAG_KEY, "1");
        renderUserCount(data.count);
      })();

      if(shouldIncrement) visitorCountRequest = request;
      await request;
    }catch(e){
      if(!increment) renderUserCount(null);
    }finally{
      if(increment) visitorCountRequest = null;
    }
  }

  function recordTrackerUse(){
    trackUniqueUser(true);
  }

  function renderUserCount(n){
    const el = document.getElementById('uniqueUsers');
    if(n === null || n === undefined){
      el.textContent = "Collector count unavailable right now";
    } else {
      el.textContent = "Approximately " + n + (n === 1 ? " collector has" : " collectors have") + " used Ooshie Tracker";
    }
  }

  function renderSetTabs(){
    const nav = document.getElementById('setTabs');
    if(activeTop !== 'collection'){
      nav.style.display = 'none';
      return;
    }
    nav.style.display = 'grid';
    nav.innerHTML = "";
    OZZIES.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      const longName = s.label.length > 9;
      btn.className = (longName ? 'wide ' : '') + (i === activeSetIndex ? 'active' : '');
      btn.addEventListener('click', () => {
        activeSetIndex = i;
        renderSetTabs();
        renderCollection();
      });
      nav.appendChild(btn);
    });
  }

  function renderCollection(){
    const root = document.getElementById('view-collection');
    root.innerHTML = "";
    const s = OZZIES[activeSetIndex];

    const block = document.createElement('div');
    block.className = 'set-block';

    const haveInSet = s.items.filter(n => state.counts[setKey(s.set,n)] > 0).length;
    const title = document.createElement('div');
    title.className = 'set-title';
    title.innerHTML = `<span>${s.label}</span><span>${haveInSet}/${s.items.length}</span>`;
    block.appendChild(title);

    s.items.forEach(name => {
      const id = setKey(s.set, name);
      const qty = state.counts[id];
      const card = document.createElement('div');
      card.className = 'ozzie-card ' + (qty > 0 ? 'have' : 'missing');

      card.appendChild(photoTile(s.set, name));

      const dot = document.createElement('span');
      dot.className = 'ozzie-status-dot';
      card.appendChild(dot);

      const nameSpan = document.createElement('span');
      nameSpan.className = 'ozzie-name';
      nameSpan.innerHTML = `${name}${qty > 1 ? `<span class="badge">${qty} in hand</span>` : ''}`;
      card.appendChild(nameSpan);

      const stepper = document.createElement('span');
      stepper.className = 'stepper';
      stepper.innerHTML = `
        <button data-action="dec" data-id="${id}" aria-label="Decrease ${name}">–</button>
        <span class="qty">${qty}</span>
        <button data-action="inc" data-id="${id}" aria-label="Increase ${name}">+</button>
      `;
      card.appendChild(stepper);

      block.appendChild(card);
    });

    root.appendChild(block);

    root.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        const previousCount = state.counts[id] || 0;
        if(action === 'inc'){
          state.counts[id] = (state.counts[id] || 0) + 1;
        } else {
          state.counts[id] = Math.max(0, (state.counts[id] || 0) - 1);
          if(state.swap[id] > state.counts[id]) state.swap[id] = state.counts[id];
        }
        if(state.counts[id] !== previousCount) recordTrackerUse();
        saveState();
        updateProgress();
        renderCollection();
      });
    });
  }

  function renderSwap(){
    const root = document.getElementById('view-swap');
    root.innerHTML = "";

    const dupes = [];
    OZZIES.forEach(s => s.items.forEach(name => {
      const id = setKey(s.set, name);
      if(state.counts[id] > 1) dupes.push({id, name, set:s.set, label:s.label, count:state.counts[id]});
    }));

    const offering = [];
    let totalOffered = 0;
    OZZIES.forEach(s => s.items.forEach(name => {
      const id = setKey(s.set, name);
      if(state.swap[id] > 0){
        offering.push(`${name} (${state.swap[id]})`);
        totalOffered += state.swap[id];
      }
    }));

    const summary = document.createElement('div');
    summary.className = 'want-summary';
    summary.innerHTML = offering.length
      ? `Offering <span class="swap-total">${totalOffered}</span> total: ${offering.join(', ')}`
      : `Choose how many duplicates you're happy to offer.`;
    root.appendChild(summary);

    if(dupes.length === 0){
      root.innerHTML = `<div class="empty-msg">No duplicates yet. Once you have more than 1 of an Ooshie, it'll show up here so you can mark how many you're happy to swap.</div>`;
      return;
    }

    dupes.forEach(d => {
      const swapQty = Math.min(state.swap[d.id] || 0, d.count);
      const card = document.createElement('div');
      card.className = 'swap-card';

      card.appendChild(photoTile(d.set, d.name));

      const nameSpan = document.createElement('span');
      nameSpan.className = 'ozzie-name';
      nameSpan.innerHTML = `${d.name}<span class="badge">have ${d.count} &middot; ${d.label}</span>`;
      card.appendChild(nameSpan);

      const stepper = document.createElement('span');
      stepper.className = 'stepper';
      stepper.innerHTML = `
        <button data-action="swapdec" data-id="${d.id}" aria-label="Decrease swap amount for ${d.name}">–</button>
        <span class="qty">${swapQty}</span>
        <button data-action="swapinc" data-id="${d.id}" data-max="${d.count}" aria-label="Increase swap amount for ${d.name}">+</button>
      `;
      card.appendChild(stepper);

      root.appendChild(card);
    });

    root.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        const max = parseInt(btn.getAttribute('data-max') || "0", 10);
        const previousSwap = state.swap[id] || 0;
        if(action === 'swapinc'){
          state.swap[id] = Math.min(max, (state.swap[id] || 0) + 1);
        } else {
          state.swap[id] = Math.max(0, (state.swap[id] || 0) - 1);
        }
        if(state.swap[id] !== previousSwap) recordTrackerUse();
        saveState();
        renderSwap();
      });
    });
  }

  function renderWant(){
    const root = document.getElementById('view-want');
    root.innerHTML = "";

    const wanted = [];
    let totalWanted = 0;
    OZZIES.forEach(s => s.items.forEach(name => {
      const id = setKey(s.set, name);
      if(state.want[id] > 0){
        wanted.push({id, name, qty: state.want[id]});
        totalWanted += state.want[id];
      }
    }));

    const summary = document.createElement('div');
    summary.className = 'want-summary';
    if(wanted.length === 0){
      summary.innerHTML = `Pick anything below that you'd like.`;
    } else {
      const wantLines = wanted.map(o => `${o.name} (${o.qty})`).join(', ');
      summary.innerHTML = `Wanting <span class="swap-total">${totalWanted}</span> total: ${wantLines}`;
    }
    root.appendChild(summary);

    const wantSetTabs = document.createElement('nav');
    wantSetTabs.className = 'set-tabs want-set-tabs';
    OZZIES.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      const longName = s.label.length > 9;
      btn.className = (longName ? 'wide ' : '') + (i === activeWantSetIndex ? 'active' : '');
      btn.addEventListener('click', () => {
        activeWantSetIndex = i;
        renderWant();
      });
      wantSetTabs.appendChild(btn);
    });
    root.appendChild(wantSetTabs);

    const s = OZZIES[activeWantSetIndex];
    const block = document.createElement('div');
    block.className = 'set-block';

    s.items.forEach(name => {
      const id = setKey(s.set, name);
      const owned = state.counts[id] > 0;
      const wantQty = state.want[id] || 0;
      const card = document.createElement('div');
      card.className = 'want-card';
      card.appendChild(photoTile(s.set, name));
      const nameSpan = document.createElement('span');
      nameSpan.className = 'ozzie-name';
      nameSpan.innerHTML = `${name}${owned ? `<span class="badge" style="color:var(--sub)">already have ${state.counts[id]}</span>` : ''}`;
      card.appendChild(nameSpan);
      const stepper = document.createElement('span');
      stepper.className = 'stepper';
      stepper.innerHTML = `
        <button data-action="wantdec" data-id="${id}" aria-label="Decrease want amount for ${name}">–</button>
        <span class="qty">${wantQty}</span>
        <button data-action="wantinc" data-id="${id}" aria-label="Increase want amount for ${name}">+</button>
      `;
      card.appendChild(stepper);
      block.appendChild(card);
    });
    root.appendChild(block);

    root.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        const previousWant = state.want[id] || 0;
        if(action === 'wantinc'){
          state.want[id] = (state.want[id] || 0) + 1;
        } else {
          state.want[id] = Math.max(0, (state.want[id] || 0) - 1);
          if(state.want[id] === 0) delete state.want[id];
        }
        if((state.want[id] || 0) !== previousWant) recordTrackerUse();
        saveState();
        renderWant();
      });
    });
  }

  let scanStream = null;
  let scanRAF = null;

  function buildMyTradeLists(){
    const offer = [];
    const want = [];
    OZZIES.forEach(s => s.items.forEach(name => {
      const id = setKey(s.set, name);
      if(state.swap[id] > 0) offer.push({n: name, s: s.set, q: state.swap[id]});
      if(state.want[id] > 0) want.push({n: name, s: s.set, q: state.want[id]});
    }));
    return { offer, want };
  }

  function buildMyPayload(){
    const offer = [];
    const want = [];
    QR_ITEMS.forEach((item, index) => {
      const id = setKey(item.s, item.n);
      if(state.swap[id] > 0) offer.push([index, state.swap[id]]);
      if(state.want[id] > 0) want.push([index, state.want[id]]);
    });
    return { v:2, o:offer, w:want };
  }

  function expandScannedPayload(payload){
    if(payload && payload.v === 2 && Array.isArray(payload.o) && Array.isArray(payload.w)){
      const expand = rows => rows.map(row => {
        const item = QR_ITEMS[row[0]];
        const qty = Number(row[1]);
        return item && Number.isFinite(qty) && qty > 0 ? {n:item.n, s:item.s, q:qty} : null;
      }).filter(Boolean);
      return {offer:expand(payload.o), want:expand(payload.w)};
    }
    if(payload && Array.isArray(payload.offer) && Array.isArray(payload.want)) return payload;
    throw new Error('invalid payload');
  }

  function renderMatch(){
    const root = document.getElementById('view-match');
    root.innerHTML = "";

    const genSection = document.createElement('div');
    genSection.className = 'match-section';
    genSection.innerHTML = `
      <h3>Your Swap Code</h3>
      <p>Generate a QR of what you're offering and what you want. Show it to another collector.</p>
      <button class="big-btn" id="genQrBtn">Generate my QR Code</button>
      <div id="qrCanvasWrap"></div>
    `;
    root.appendChild(genSection);

    const scanSection = document.createElement('div');
    scanSection.className = 'match-section';
    scanSection.innerHTML = `
      <h3>Scan Their Code</h3>
      <p>Scan someone else's QR to see if you can swap.</p>
      <button class="big-btn secondary" id="scanQrBtn">Scan a QR Code</button>
      <video id="scanVideo" style="display:none;" playsinline muted></video>
      <canvas id="scanCanvas" style="display:none;"></canvas>
      <div class="scan-actions">
        <button class="big-btn secondary" id="scanPhotoBtn">Scan from Photo</button>
        <button class="big-btn secondary" id="stopScanBtn" style="display:none;">Stop Camera</button>
      </div>
      <input id="scanFile" type="file" accept="image/*">
      <div class="scan-status" id="scanStatus" aria-live="polite"></div>
    `;
    root.appendChild(scanSection);

    const resultsWrap = document.createElement('div');
    resultsWrap.id = 'matchResults';
    root.appendChild(resultsWrap);

    document.getElementById('genQrBtn').addEventListener('click', () => {
      const wrap = document.getElementById('qrCanvasWrap');
      wrap.innerHTML = "";
      try{
        if(typeof QRCode === 'undefined'){
          wrap.innerHTML = `<div class="no-match">QR library not loaded (QRCode is undefined). Check your connection and reload.</div>`;
          return;
        }
        const payload = buildMyPayload();
        if(payload.o.length === 0 && payload.w.length === 0){
          wrap.innerHTML = `<div class="no-match">Mark some Ooshies to swap and want first, on the Swap and Want tabs.</div>`;
          return;
        }
        const json = JSON.stringify(payload);
        new QRCode(wrap, {
          text: json,
          width: 260,
          height: 260,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
        recordTrackerUse();
      }catch(ex){
        wrap.innerHTML = `<div class="no-match">Unexpected error: ${ex.message || ex}</div>`;
      }
    });

    document.getElementById('scanQrBtn').addEventListener('click', startScan);
    document.getElementById('stopScanBtn').addEventListener('click', stopScan);
    document.getElementById('scanPhotoBtn').addEventListener('click', () => document.getElementById('scanFile').click());
    document.getElementById('scanFile').addEventListener('change', scanSelectedPhoto);
  }

  async function startScan(){
    const video = document.getElementById('scanVideo');
    const canvas = document.getElementById('scanCanvas');
    const status = document.getElementById('scanStatus');
    const stopBtn = document.getElementById('stopScanBtn');

    if(typeof jsQR === 'undefined'){
      status.textContent = 'The QR scanner could not load. Reload the page and try again.';
      return;
    }

    stopScan();
    video.style.display = 'block';
    stopBtn.style.display = 'block';
    status.textContent = 'Starting camera. Point it at the full QR code and hold still.';

    try{
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: {facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}},
        audio: false
      });
      video.srcObject = scanStream;
      video.setAttribute('playsinline', '');
      video.setAttribute('autoplay', '');
      await video.play();
      status.textContent = 'Scanning. Keep the full QR code inside the camera view.';
      scanRAF = requestAnimationFrame(tickScan);
    }catch(e){
      stopScan();
      status.textContent = 'Camera access was blocked or unavailable. Allow camera access, or use Scan from Photo.';
    }

    function tickScan(){
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {inversionAttempts:'attemptBoth'});
        if(code){
          stopScan();
          handleScannedPayload(code.data);
          return;
        }
      }
      scanRAF = requestAnimationFrame(tickScan);
    }
  }

  function stopScan(){
    if(scanRAF) cancelAnimationFrame(scanRAF);
    if(scanStream) scanStream.getTracks().forEach(t => t.stop());
    const video = document.getElementById('scanVideo');
    if(video){
      video.pause();
      video.srcObject = null;
      video.style.display = 'none';
    }
    const stopBtn = document.getElementById('stopScanBtn');
    if(stopBtn) stopBtn.style.display = 'none';
    scanRAF = null;
    scanStream = null;
  }

  function scanSelectedPhoto(event){
    const file = event.target.files && event.target.files[0];
    const status = document.getElementById('scanStatus');
    if(!file || typeof jsQR === 'undefined') return;
    status.textContent = 'Reading QR code from photo.';
    const img = new Image();
    img.onload = () => {
      const canvas = document.getElementById('scanCanvas');
      const maxSide = 1800;
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      const ctx = canvas.getContext('2d', {willReadFrequently:true});
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {inversionAttempts:'attemptBoth'});
      URL.revokeObjectURL(img.src);
      event.target.value = '';
      if(code){
        status.textContent = 'QR code found.';
        handleScannedPayload(code.data);
      }else{
        status.textContent = 'No QR code was found in that photo. Try a closer, sharper photo with the full code visible.';
      }
    };
    img.onerror = () => { status.textContent = 'That photo could not be read. Please try another image.'; };
    img.src = URL.createObjectURL(file);
  }

  function handleScannedPayload(raw){
    let theirs;
    try{ theirs = expandScannedPayload(JSON.parse(raw)); }catch(e){
      document.getElementById('matchResults').innerHTML = `<div class="no-match">That QR code doesn't look like an Ooshie swap code.</div>`;
      return;
    }
    const mine = buildMyTradeLists();

    const iGiveThem = mine.offer.filter(o => theirs.want.some(w => w.n === o.n && w.s === o.s));
    const theyGiveMe = theirs.offer.filter(o => mine.want.some(w => w.n === o.n && w.s === o.s));

    const wrap = document.getElementById('matchResults');
    wrap.innerHTML = "";

    if(iGiveThem.length === 0 && theyGiveMe.length === 0){
      wrap.innerHTML = `<div class="no-match">No matches this time — nothing you offer is on their want list, and nothing they offer is on yours.</div>`;
      return;
    }

    const box = document.createElement('div');
    box.className = 'match-result';
    box.innerHTML = `<h4>Possible swap</h4>`;

    const maxRows = Math.max(iGiveThem.length, theyGiveMe.length);
    for(let i=0; i<maxRows; i++){
      const give = iGiveThem[i];
      const get = theyGiveMe[i];
      const row = document.createElement('div');
      row.className = 'match-row';
      row.innerHTML = `
        <span>${give ? 'You give: ' + give.n : ''}</span>
        <span class="arrow">${(give && get) ? '⇄' : ''}</span>
        <span>${get ? 'You get: ' + get.n : ''}</span>
      `;
      box.appendChild(row);
    }
    wrap.appendChild(box);
  }

  function updateProgress(){
    const have = ALL_IDS.filter(id => state.counts[id] > 0).length;
    document.getElementById('progressCount').textContent = `${have} / 40`;
    document.getElementById('progressFill').style.width = (have/40*100) + '%';
  }

  function renderActiveTop(){
    document.getElementById('view-collection').style.display = activeTop === 'collection' ? '' : 'none';
    document.getElementById('view-swap').style.display = activeTop === 'swap' ? '' : 'none';
    document.getElementById('view-want').style.display = activeTop === 'want' ? '' : 'none';
    document.getElementById('view-match').style.display = activeTop === 'match' ? '' : 'none';

    if(activeTop !== 'match') stopScan();

    renderSetTabs();
    if(activeTop === 'collection') renderCollection();
    if(activeTop === 'swap') renderSwap();
    if(activeTop === 'want') renderWant();
    if(activeTop === 'match') renderMatch();
  }

  document.querySelectorAll('.top-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTop = btn.getAttribute('data-top');
      renderActiveTop();
    });
  });

  updateProgress();
  renderActiveTop();
  // Page loads read the aggregate total but do not increment it.
  trackUniqueUser(false);

})();
</script>
