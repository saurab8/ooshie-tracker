<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ooshie Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --bg-top:#3A4A9E;
    --bg-bottom:#8FA3E8;
    --panel:#2F3D82;
    --panel-light:#4655A0;
    --line:#5A69B5;
    --ink:#F5F3FF;
    --sub:#C3CBF2;
    --gold:#F0C244;
    --gold-dark:#B8912E;
    --teal:#4FC3B0;
    --coral:#E8674F;
    --leaf:#7CB342;
    --have:#4FC3B0;
    --missing:#7C86C4;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:56px;
  }
  .label-font{
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  header{
    padding:18px 18px 12px;
    position:sticky;
    top:0;
    z-index:20;
    background:linear-gradient(180deg, var(--bg-top) 60%, transparent 100%);
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--gold);
  }
  header .tag{
    font-size:0.85rem;
    color:var(--sub);
    margin-top:4px;
  }

  .progress-wrap{
    padding:12px 18px 0;
  }
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:0.8rem;
    margin-bottom:6px;
    color:var(--sub);
  }
  .progress-row .count{
    font-size:1.1rem;
    font-weight:700;
    color:var(--gold);
  }
  .progress-bar{
    height:8px;
    background:rgba(255,255,255,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--teal);
    transition:width 0.3s ease;
  }

  nav.top-tabs{
    display:flex;
    gap:6px;
    margin:16px 18px 0;
  }
  nav.top-tabs button{
    flex:1;
    background:rgba(255,255,255,0.08);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:0.78rem;
    font-weight:600;
    padding:10px 4px;
    color:var(--sub);
    cursor:pointer;
  }
  nav.top-tabs button.active{
    background:var(--gold);
    color:#2A2100;
    border-color:var(--gold);
  }

  nav.set-tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    padding:14px 18px 4px;
  }
  nav.set-tabs button{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:0.72rem;
    font-weight:600;
    padding:10px 3px;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
    line-height:1.15;
  }
  nav.set-tabs button.active{
    background:var(--teal);
    color:#0d2e28;
    border-color:var(--teal);
  }

  main{
    padding:8px 18px 40px;
    max-width:640px;
    margin:0 auto;
  }

  .set-block{
    margin-bottom:16px;
  }
  .set-title{
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--sub);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }

  .ozzie-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 14px 10px 10px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .ozzie-card.missing{
    opacity:0.6;
  }
  .ozzie-photo{
    width:50px;
    height:50px;
    border-radius:10px;
    background:var(--panel-light);
    flex-shrink:0;
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.62rem;
    font-weight:700;
    color:var(--sub);
    text-align:center;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .ozzie-status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
    background:var(--missing);
  }
  .ozzie-card.have .ozzie-status-dot{
    background:var(--have);
  }
  .ozzie-name{
    flex:1;
    font-size:1.05rem;
    line-height:1.25;
    color:var(--ink);
  }
  .ozzie-name .badge{
    display:block;
    font-size:0.7rem;
    color:var(--gold);
    letter-spacing:0.03em;
    margin-top:2px;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stepper button{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--gold);
    background:transparent;
    font-size:1.15rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
  }
  .stepper button:active{
    background:var(--gold);
    color:#2A2100;
  }
  .stepper .qty{
    min-width:20px;
    text-align:center;
    font-weight:700;
    font-size:1.05rem;
    color:var(--ink);
  }

  .swap-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .swap-card .row1{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:10px;
  }
  .swap-card .row1 .ozzie-photo{width:40px;height:40px;}
  .swap-card .have-count{
    font-size:0.78rem;
    color:var(--sub);
    white-space:nowrap;
  }
  .swap-controls{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:space-between;
  }
  .swap-controls .swap-label{
    font-size:0.72rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--coral);
    font-weight:600;
  }

  .empty-msg{
    text-align:center;
    padding:36px 20px;
    color:var(--sub);
    font-size:0.95rem;
    opacity:0.85;
  }

  .want-summary{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
    font-size:0.92rem;
    color:var(--ink);
  }
  .want-summary .swap-total{
    font-weight:700;
    color:var(--coral);
  }

  .want-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 14px 10px 10px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .want-card .ozzie-name{font-size:1rem;}
  .want-card .ozzie-photo{width:40px;height:40px;}

  .match-section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    text-align:center;
  }
  .match-section h3{
    margin:0 0 6px;
    font-size:1.05rem;
    color:var(--gold);
  }
  .match-section p{
    font-size:0.85rem;
    color:var(--sub);
    margin:0 0 12px;
  }
  .big-btn{
    background:var(--gold);
    color:#2A2100;
    border:none;
    border-radius:10px;
    padding:13px 20px;
    font-size:0.85rem;
    font-weight:700;
    letter-spacing:0.03em;
    cursor:pointer;
    width:100%;
  }
  .big-btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--gold);
  }
  #qrCanvasWrap{
    display:flex;
    justify-content:center;
    margin:14px 0;
  }
  #qrCanvasWrap canvas{
    border-radius:8px;
  }
  video#scanVideo{
    width:100%;
    border-radius:8px;
    border:1px solid var(--line);
    margin:10px 0;
  }
  .match-result{
    background:var(--panel-light);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .match-result h4{
    margin:0 0 8px;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--teal);
    font-weight:700;
  }
  .match-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
    font-size:0.92rem;
    color:var(--ink);
  }
  .match-row:last-child{border-bottom:none;}
  .match-row .arrow{
    color:var(--coral);
    margin:0 6px;
  }
  .no-match{
    text-align:center;
    color:var(--sub);
    opacity:0.85;
    font-size:0.9rem;
    padding:16px;
  }

  footer.stats{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--panel);
    color:var(--sub);
    padding:10px 18px;
    font-size:0.72rem;
    text-align:center;
    z-index:20;
    border-top:1px solid var(--line);
  }
  footer.stats a{
    color:var(--gold);
    text-decoration:none;
  }
  footer.stats img.logo{
    height:14px;
    vertical-align:middle;
    margin-right:5px;
  }

  .save-flash{
    position:fixed;
    bottom:48px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--teal);
    color:#0d2e28;
    font-size:0.75rem;
    font-weight:700;
    padding:7px 16px;
    border-radius:20px;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    z-index:30;
  }
  .save-flash.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <h1>Ooshie Tracker</h1>
  <div class="tag">40 characters &middot; track, swap, want, match</div>
</header>

<div class="progress-wrap">
  <div class="progress-row">
    <span class="label-font">Collected</span>
    <span class="count" id="progressCount">0 / 40</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<nav class="top-tabs">
  <button class="top-tab-btn active" data-top="collection">Collection</button>
  <button class="top-tab-btn" data-top="swap">Swap</button>
  <button class="top-tab-btn" data-top="want">Want</button>
  <button class="top-tab-btn" data-top="match">Match</button>
</nav>

<nav class="set-tabs" id="setTabs"></nav>

<main>
  <div id="view-collection"></div>
  <div id="view-swap" style="display:none;"></div>
  <div id="view-want" style="display:none;"></div>
  <div id="view-match" style="display:none;"></div>
</main>

<div class="save-flash" id="saveFlash">saved</div>

<footer class="stats">
  <span id="uniqueUsers">— unique collectors have used this tracker —</span><br>
  <a href="https://techtyra.com.au" target="_blank" rel="noopener"><img class="logo" src="assets/techtyra-logo.png" alt="TechTyra">TechTyra</a>
  &middot; <a href="privacy.html">Privacy</a>
  &middot; <a href="terms.html">Terms</a>
  &middot; <a href="contact.html">Contact</a>
</footer>

<script>
(function(){

  const OZZIES = [
    {set:"Moana", label:"Moana", items:["Moana","Maui","Pua","Hei Hei","Kakamora"]},
    {set:"Toy Story 5", label:"Toy Story", items:["Jessie","Woody","Buzz Lightyear","Bullseye","Lilypad"]},
    {set:"Spider-Man", label:"Spider-Man", items:["Spider-Man","Hulk","Tombstone","Scorpion","Tarantula"]},
    {set:"Mandalorian", label:"Mandalorian", items:["Mandalorian","Grogu","Anzellan","Zeb","Stormtrooper"]},
    {set:"Disney", label:"Disney", items:["Elsa","Anna","Stitch","Lilo","Judy Hopps"]},
    {set:"Pixar", label:"Pixar", items:["Mike","Sully","Anxiety","Joy","Lightning McQueen"]},
    {set:"Marvel", label:"Marvel", items:["The Thing","Wolverine","Doctor Doom","Thor","Gambit"]},
    {set:"Star Wars", label:"Star Wars", items:["Darth Vader","C-3PO","Princess Leia","Luke Skywalker","R2-D2"]}
  ];

  function slugify(str){
    return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  const ALL_IDS = [];
  OZZIES.forEach(s => s.items.forEach(name => ALL_IDS.push(setKey(s.set, name))));

  function setKey(set, name){ return set + "::" + name; }
  function imgPath(set, name){
    return `images/${slugify(set)}/${slugify(name)}.jpg`;
  }

  const STORAGE_KEY = "ozzie-tracker-data-v2";
  const USER_FLAG_KEY = "ozzie-tracker-counted-v1";

  let state = loadState();
  let activeSetIndex = 0;
  let activeWantSetIndex = 0;
  let activeTop = 'collection';

  function loadState(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    let parsed = raw ? JSON.parse(raw) : {};
    let counts = parsed.counts || {};
    let swap = parsed.swap || {};
    let want = parsed.want || {};
    ALL_IDS.forEach(id => {
      if(typeof counts[id] !== "number") counts[id] = 0;
      if(typeof swap[id] !== "number") swap[id] = 0;
    });
    return {counts, swap, want};
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      flashSave();
    }catch(e){}
  }

  let flashTimer = null;
  function flashSave(){
    const el = document.getElementById('saveFlash');
    el.classList.add('show');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(()=> el.classList.remove('show'), 700);
  }

  function photoTile(set, name){
    const src = imgPath(set, name);
    const div = document.createElement('div');
    div.className = 'ozzie-photo';
    div.style.backgroundImage = `url('${src}')`;
    div.textContent = '';
    const fallback = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const img = new Image();
    img.onerror = () => { div.style.backgroundImage = 'none'; div.textContent = fallback; };
    img.src = src;
    return div;
  }

  async function trackUniqueUser(){
    try{
      const already = localStorage.getItem(USER_FLAG_KEY);
      const method = already ? 'GET' : 'POST';
      if(!already) localStorage.setItem(USER_FLAG_KEY, "1");
      const resp = await fetch('/api/visitor', { method });
      if(!resp.ok) throw new Error('bad response');
      const data = await resp.json();
      renderUserCount(data.count);
    }catch(e){
      renderUserCount(null);
    }
  }

  function renderUserCount(n){
    const el = document.getElementById('uniqueUsers');
    if(n === null || n === undefined){
      el.textContent = "Collector count unavailable right now";
    } else {
      el.textContent = n + (n === 1 ? " collector has" : " collectors have") + " used Ooshie Tracker";
    }
  }

  function renderSetTabs(){
    const nav = document.getElementById('setTabs');
    if(activeTop !== 'collection'){
      nav.style.display = 'none';
      return;
    }
    nav.style.display = 'grid';
    nav.innerHTML = "";
    OZZIES.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      btn.className = i === activeSetIndex ? 'active' : '';
      btn.addEventListener('click', () => {
        activeSetIndex = i;
        renderSetTabs();
        renderCollection();
      });
      nav.appendChild(btn);
    });
  }

  function renderCollection(){
    const root = document.getElementById('view-collection');
    root.innerHTML = "";
    const s = OZZIES[activeSetIndex];

    const block = document.createElement('div');
    block.className = 'set-block';

    const haveInSet = s.items.filter(n => state.counts[setKey(s.set,n)] > 0).length;
    const title = document.createElement('div');
    title.className = 'set-title';
    title.innerHTML = `<span>${s.label}</span><span>${haveInSet}/${s.items.length}</span>`;
    block.appendChild(title);

    s.items.forEach(name => {
      const id = setKey(s.set, name);
      const qty = state.counts[id];
      const card = document.createElement('div');
      card.className = 'ozzie-card ' + (qty > 0 ? 'have' : 'missing');

      card.appendChild(photoTile(s.set, name));

      const dot = document.createElement('span');
      dot.className = 'ozzie-status-dot';
      card.appendChild(dot);

      const nameSpan = document.createElement('span');
      nameSpan.className = 'ozzie-name';
      nameSpan.innerHTML = `${name}${qty > 1 ? `<span class="badge">${qty} in hand</span>` : ''}`;
      card.appendChild(nameSpan);

      const stepper = document.createElement('span');
      stepper.className = 'stepper';
      stepper.innerHTML = `
        <button data-action="dec" data-id="${id}" aria-label="Decrease ${name}">–</button>
        <span class="qty">${qty}</span>
        <button data-action="inc" data-id="${id}" aria-label="Increase ${name}">+</button>
      `;
      card.appendChild(stepper);

      block.appendChild(card);
    });

    root.appendChild(block);

    root.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        if(action === 'inc'){
          state.counts[id] = (state.counts[id] || 0) + 1;
        } else {
          state.counts[id] = Math.max(0, (state.counts[id] || 0) - 1);
          if(state.swap[id] > state.counts[id]) state.swap[id] = state.counts[id];
        }
        saveState();
        updateProgress();
        renderCollection();
      });
    });
  }

  function renderSwap(){
    const root = document.getElementById('view-swap');
    root.innerHTML = "";

    const dupes = [];
    OZZIES.forEach(s => s.items.forEach(name => {
      const id = setKey(s.set, name);
      if(state.counts[id] > 1) dupes.push({id, name, set:s.set, label:s.label, count:state.counts[id]});
    }));

    if(dupes.length === 0){
      root.innerHTML = `<div class="empty-msg">No duplicates yet. Once you have more than 1 of an Ooshie, it'll show up here so you can mark how many you're happy to swap.</div>`;
      return;
    }

    dupes.forEach(d => {
      const swapQty = Math.min(state.swap[d.id] || 0, d.count);
      const card = document.createElement('div');
      card.className = 'swap-card';

      const row1 = document.createElement('div');
      row1.className = 'row1';
      row1.appendChild(photoTile(d.set, d.name));
      const nameSpan = document.createElement('span');
      nameSpan.className = 'ozzie-name';
      nameSpan.innerHTML = `${d.name}<span class="badge" style="color:var(--sub)">${d.label}</span>`;
      row1.appendChild(nameSpan);
      const haveCount = document.createElement('span');
      haveCount.className = 'have-count';
      haveCount.textContent = `have ${d.count}`;
      row1.appendChild(haveCount);
      card.appendChild(row1);

      const controls = document.createElement('div');
      controls.className = 'swap-controls';
      controls.innerHTML = `
        <span class="swap-label">Willing to swap</span>
        <span class="stepper">
          <button data-action="swapdec" data-id="${d.id}" aria-label="Decrease swap amount for ${d.name}">–</button>
          <span class="qty">${swapQty}</span>
          <button data-action="swapinc" data-id="${d.id}" data-max="${d.count}" aria-label="Increase swap amount for ${d.name}">+</button>
        </span>
      `;
      card.appendChild(controls);

      root.appendChild(card);
    });

    root.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        const max = parseInt(btn.getAttribute('data-max') || "0", 10);
        if(action === 'swapinc'){
          state.swap[id] = Math.min(max, (state.swap[id] || 0) + 1);
        } else {
          state.swap[id] = Math.max(0, (state.swap[id] || 0) - 1);
        }
        saveState();
        renderSwap();
      });
    });
  }

  function renderWant(){
    const root = document.getElementById('view-want');
    root.innerHTML = "";

    const offering = [];
    let totalOffered = 0;
    OZZIES.forEach(s => s.items.forEach(name => {
      const id = setKey(s.set, name);
      if(state.swap[id] > 0){
        offering.push({id, name, qty: state.swap[id]});
        totalOffered += state.swap[id];
      }
    }));

    const summary = document.createElement('div');
    summary.className = 'want-summary';
    if(offering.length === 0){
      summary.innerHTML = `Pick anything below you'd like &mdash; you don't need to offer a swap first.`;
    } else {
      const offerLines = offering.map(o => `${o.name} (${o.qty})`).join(', ');
      summary.innerHTML = `Offering <span class="swap-total">${totalOffered}</span> total: ${offerLines}`;
    }
    root.appendChild(summary);

    const wantSetTabs = document.createElement('nav');
    wantSetTabs.className = 'set-tabs';
    wantSetTabs.style.padding = '0 0 12px';
    OZZIES.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      btn.className = i === activeWantSetIndex ? 'active' : '';
      btn.addEventListener('click', () => {
        activeWantSetIndex = i;
        renderWant();
      });
      wantSetTabs.appendChild(btn);
    });
    root.appendChild(wantSetTabs);

    const s = OZZIES[activeWantSetIndex];
    const block = document.createElement('div');
    block.className = 'set-block';

    s.items.forEach(name => {
      const id = setKey(s.set, name);
      const owned = state.counts[id] > 0;
      const wantQty = state.want[id] || 0;
      const card = document.createElement('div');
      card.className = 'want-card';
      card.appendChild(photoTile(s.set, name));
      const nameSpan = document.createElement('span');
      nameSpan.className = 'ozzie-name';
      nameSpan.innerHTML = `${name}${owned ? `<span class="badge" style="color:var(--sub)">already have ${state.counts[id]}</span>` : ''}`;
      card.appendChild(nameSpan);
      const stepper = document.createElement('span');
      stepper.className = 'stepper';
      stepper.innerHTML = `
        <button data-action="wantdec" data-id="${id}" aria-label="Decrease want amount for ${name}">–</button>
        <span class="qty">${wantQty}</span>
        <button data-action="wantinc" data-id="${id}" aria-label="Increase want amount for ${name}">+</button>
      `;
      card.appendChild(stepper);
      block.appendChild(card);
    });
    root.appendChild(block);

    root.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        if(action === 'wantinc'){
          state.want[id] = (state.want[id] || 0) + 1;
        } else {
          state.want[id] = Math.max(0, (state.want[id] || 0) - 1);
          if(state.want[id] === 0) delete state.want[id];
        }
        saveState();
        renderWant();
      });
    });
  }

  let scanStream = null;
  let scanRAF = null;

  function buildMyPayload(){
    const offer = [];
    const want = [];
    OZZIES.forEach(s => s.items.forEach(name => {
      const id = setKey(s.set, name);
      if(state.swap[id] > 0) offer.push({n: name, s: s.set, q: state.swap[id]});
      if(state.want[id] > 0) want.push({n: name, s: s.set, q: state.want[id]});
    }));
    return { offer, want };
  }

  function renderMatch(){
    const root = document.getElementById('view-match');
    root.innerHTML = "";

    const genSection = document.createElement('div');
    genSection.className = 'match-section';
    genSection.innerHTML = `
      <h3>Your swap code</h3>
      <p>Generate a QR of what you're offering and what you want. Show it to another collector.</p>
      <button class="big-btn" id="genQrBtn">Generate my QR code</button>
      <div id="qrCanvasWrap"></div>
    `;
    root.appendChild(genSection);

    const scanSection = document.createElement('div');
    scanSection.className = 'match-section';
    scanSection.innerHTML = `
      <h3>Scan their code</h3>
      <p>Scan someone else's QR to see if you can swap.</p>
      <button class="big-btn secondary" id="scanQrBtn">Scan a QR code</button>
      <video id="scanVideo" style="display:none;" playsinline muted></video>
      <canvas id="scanCanvas" style="display:none;"></canvas>
    `;
    root.appendChild(scanSection);

    const resultsWrap = document.createElement('div');
    resultsWrap.id = 'matchResults';
    root.appendChild(resultsWrap);

    document.getElementById('genQrBtn').addEventListener('click', () => {
      const payload = buildMyPayload();
      if(payload.offer.length === 0 && payload.want.length === 0){
        document.getElementById('qrCanvasWrap').innerHTML = `<div class="no-match">Mark some Ooshies to swap and want first, on the Swap and Want tabs.</div>`;
        return;
      }
      const json = JSON.stringify(payload);
      const wrap = document.getElementById('qrCanvasWrap');
      wrap.innerHTML = "";
      const canvas = document.createElement('canvas');
      wrap.appendChild(canvas);
      QRCode.toCanvas(canvas, json, { width: 220, margin: 1 }, function(err){
        if(err) wrap.innerHTML = `<div class="no-match">Could not generate QR — too much data. Try marking fewer items.</div>`;
      });
    });

    document.getElementById('scanQrBtn').addEventListener('click', startScan);
  }

  function startScan(){
    const video = document.getElementById('scanVideo');
    const canvas = document.getElementById('scanCanvas');
    video.style.display = 'block';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        scanStream = stream;
        video.srcObject = stream;
        video.setAttribute('playsinline', true);
        video.play();
        scanRAF = requestAnimationFrame(tickScan);
      })
      .catch(() => {
        document.getElementById('matchResults').innerHTML = `<div class="no-match">Camera access was blocked or unavailable. Check your browser's camera permission for this site.</div>`;
      });

    function tickScan(){
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if(code){
          stopScan();
          handleScannedPayload(code.data);
          return;
        }
      }
      scanRAF = requestAnimationFrame(tickScan);
    }
  }

  function stopScan(){
    if(scanRAF) cancelAnimationFrame(scanRAF);
    if(scanStream) scanStream.getTracks().forEach(t => t.stop());
    const video = document.getElementById('scanVideo');
    if(video) video.style.display = 'none';
  }

  function handleScannedPayload(raw){
    let theirs;
    try{ theirs = JSON.parse(raw); }catch(e){
      document.getElementById('matchResults').innerHTML = `<div class="no-match">That QR code doesn't look like an Ooshie swap code.</div>`;
      return;
    }
    const mine = buildMyPayload();

    const iGiveThem = mine.offer.filter(o => theirs.want.some(w => w.n === o.n && w.s === o.s));
    const theyGiveMe = theirs.offer.filter(o => mine.want.some(w => w.n === o.n && w.s === o.s));

    const wrap = document.getElementById('matchResults');
    wrap.innerHTML = "";

    if(iGiveThem.length === 0 && theyGiveMe.length === 0){
      wrap.innerHTML = `<div class="no-match">No matches this time — nothing you offer is on their want list, and nothing they offer is on yours.</div>`;
      return;
    }

    const box = document.createElement('div');
    box.className = 'match-result';
    box.innerHTML = `<h4>Possible swap</h4>`;

    const maxRows = Math.max(iGiveThem.length, theyGiveMe.length);
    for(let i=0; i<maxRows; i++){
      const give = iGiveThem[i];
      const get = theyGiveMe[i];
      const row = document.createElement('div');
      row.className = 'match-row';
      row.innerHTML = `
        <span>${give ? 'You give: ' + give.n : ''}</span>
        <span class="arrow">${(give && get) ? '⇄' : ''}</span>
        <span>${get ? 'You get: ' + get.n : ''}</span>
      `;
      box.appendChild(row);
    }
    wrap.appendChild(box);
  }

  function updateProgress(){
    const have = ALL_IDS.filter(id => state.counts[id] > 0).length;
    document.getElementById('progressCount').textContent = `${have} / 40`;
    document.getElementById('progressFill').style.width = (have/40*100) + '%';
  }

  function renderActiveTop(){
    document.getElementById('view-collection').style.display = activeTop === 'collection' ? '' : 'none';
    document.getElementById('view-swap').style.display = activeTop === 'swap' ? '' : 'none';
    document.getElementById('view-want').style.display = activeTop === 'want' ? '' : 'none';
    document.getElementById('view-match').style.display = activeTop === 'match' ? '' : 'none';

    if(activeTop !== 'match') stopScan();

    renderSetTabs();
    if(activeTop === 'collection') renderCollection();
    if(activeTop === 'swap') renderSwap();
    if(activeTop === 'want') renderWant();
    if(activeTop === 'match') renderMatch();
  }

  document.querySelectorAll('.top-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTop = btn.getAttribute('data-top');
      renderActiveTop();
    });
  });

  updateProgress();
  renderActiveTop();
  trackUniqueUser();

})();
</script>

</body>
</html>
